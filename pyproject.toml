[project]
name = "math-mcp-server"
version = "0.1.0"
description = "Extremely powerful MCP server for symbolic, numerical, and GPU-accelerated mathematics"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.0.0",
    "sympy>=1.13",
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "networkx>=3.2",
    "pint>=0.23",
    "cupy-cuda12x>=13.0",
    "mpmath>=1.3",
    "pydantic>=2.0",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.2",
    "ruff>=0.3",
]

[project.scripts]
math-mcp-server = "math_mcp.server:main"

[project.entry-points."mcp.servers"]
math = "math_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/math_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]
timeout = 30
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gpu: marks tests requiring GPU (skip with '-m \"not gpu\"')",
]

